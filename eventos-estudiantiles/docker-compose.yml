services:
  database:
    image: postgres:16-alpine
    container_name: eventos-database

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend-network


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: eventos-backend

    restart: unless-stopped

    env_file:
      - .env.local
      - .env.docker

    environment:
      PORT: 3001
      DB_HOST: database
      DB_PORT: 5432

    ports:
      - "3001:3001"

    depends_on:
      database:
        condition: service_healthy

    networks:
      - backend-network


volumes:
  postgres_data:
    name: eventos-postgres-data


networks:
  backend-network:
    name: eventos-backend-network